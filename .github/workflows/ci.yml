name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: zig ${{ matrix.zig }} build test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.allow_fail }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Required green gate — matches the project toolchain (Zig 0.16.0,
          # spec 018 migration). The 0.15.2 job was retired with the floor bump.
          - zig: "0.16.0"
            tarball: zig-x86_64-linux-0.16.0.tar.xz
            shasum: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            allow_fail: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ matrix.zig }}
        run: |
          curl -fsSL "https://ziglang.org/download/${{ matrix.zig }}/${{ matrix.tarball }}" -o /tmp/zig.tar.xz
          echo "${{ matrix.shasum }}  /tmp/zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"

      - name: Restore zig cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ matrix.zig }}-${{ hashFiles('**/*.zig', 'build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ matrix.zig }}-

      - name: Format check
        run: zig fmt --check src/ tests.zig build.zig

      - name: Build
        run: zig build --summary all

      - name: Test
        run: zig build test --summary all
